const KB_RAW=`What is NLP?|Natural Language Processing lets computers read, understand and generate human language.
What does NLP stand for?|Natural Language Processing.

What is a corpus?|A large collection of text used to train or test language models.

Where can I find text datasets?|Kaggle, Hugging Face Datasets and the UCI Machine Learning Repository.
What is a token?|A small unit of text, usually a word or part of a word.
What is tokenization?|Splitting text into tokens, for example turning a sentence into a list of words.
What is a stop word?|A very common word like "the" or "is" that adds little meaning and is often removed.
What is stemming?|Cutting words to a crude root, e.g. "running" becomes "run" or "runn".
What is lemmatization?|Reducing a word to its dictionary form, e.g. "better" becomes "good". It is more accurate than stemming.
Stemming vs lemmatization?|Stemming is fast but rough; lemmatization uses a dictionary and gives real words.
Why lowercase text?|So "Good" and "good" count as the same word.
Why remove punctuation?|Punctuation usually adds noise for simple models like bag-of-words.
Why clean text?|Clean text reduces noise, shrinks vocabulary and helps models learn faster and better.
What are the steps of text preprocessing?|Lowercase, remove punctuation and noise, tokenize, remove stop words, then stem or lemmatize.
What is bag of words?|A representation that counts how often each word appears, ignoring word order.
What is a vocabulary?|The set of unique words known to the model.
What is an n-gram?|A sequence of n consecutive words, such as a bigram (2 words) or trigram (3 words).
What is TF-IDF?|Term Frequency times Inverse Document Frequency; it scores words by how important they are in a document.
What is term frequency?|How many times a word appears in a document.
What is inverse document frequency?|A measure that lowers the weight of words appearing in many documents.
Why use TF-IDF instead of counts?|It reduces the weight of common words and highlights distinctive ones.
What is cosine similarity?|A score from 0 to 1 measuring the angle between two vectors; higher means more similar text.

What is a vector?|A list of numbers that represents text so a computer can compare it.

What is text classification?|Assigning a category label to text, such as spam or not spam.

What is deep learning?|Machine learning with many-layered neural networks.
What is supervised learning?|Learning from labeled examples.

What is a feature?|An input value the model uses, such as a word's TF-IDF score.
What is training?|Letting a model learn patterns from data.
What is a training set?|The portion of data used to teach the model, usually about 80 percent.
What is a test set?|Data kept aside to check how well the model works on unseen examples.

What is overfitting?|When a model memorizes training data and performs poorly on new data.
What is underfitting?|When a model is too simple to learn the patterns in the data.

What is a confusion matrix?|A table showing correct and wrong predictions for each class.

What is dependency parsing?|Finding grammatical relations between words in a sentence.

What is BLEU?|A score that compares machine translation with human translation.

What is an FAQ chatbot?|A chatbot that answers frequently asked questions from a stored list.

What is text-to-speech?|Converting written text into spoken audio.

rw:{sub:"Umufasha wa NLP · TF-IDF + cosine similarity",ph:"Baza ikibazo cyose kuri NLP…",send:"Ohereza",clr:"Siba",hi:"Muraho! Ndi Inzobere. Mumbaze kuri NLP: tokenization, TF-IDF, sentiment, NER, ubuhinduzi n'ibindi. Mushobora kwandika cyangwa gukoresha mikoro.",none:"Mbabarira, icyo kibazo kiri hanze y'ibyo nzi. 💙 Mfasha gusa ku bibazo bya NLP, kandi sinshaka kuguha igisubizo kitari cyo.\n\nHari ikindi kuri NLP nagufashamo? Urugero: mbaza TF-IDF ni iki, cyangwa sentiment analysis ikora ite.",near:"Ntabwo ndabyumva neza. Ongera ubaze ukoresheje andi magambo, nzishimira kugerageza.",more:"Hari ikindi nagufashamo? 😊",thx:"Nta kibazo! 💙 Hari ikindi wifuza kumbaza?",hey:"Muraho! 😊 Nagufasha iki uyu munsi? Mbaza icyo ushaka cyose kuri NLP.",conf:"Guhura",tr:"Hindura",say:"Umva",foot:"Ijwi: Chrome · Ibisubizo bikurwa mu bubiko bwihishe",st:["What is TF-IDF?","What is tokenization?","How does sentiment analysis work?","What is named entity recognition?","Can NLP work for Kinyarwanda?"],nov:"Ijwi rikoresha Google Chrome."}};
// Kinyarwanda -> English keyword glossary (lets you ask in Kinyarwanda)
const GL={iki:"what",ni:"is",ikihe:"what",nte:"how",gute:"how",uko:"how",kuki:"why",ninde:"who",aho:"where",gukora:"work",ikora:"work",bukora:"work",bukoresha:"work",nsobanurira:"explain",sobanura:"explain",gusobanura:"explain",ururimi:"language",indimi:"language",amagambo:"words",ijambo:"word",inyandiko:"text",amakuru:"data",imashini:"machine",kwiga:"learning",ubwenge:"intelligence",ubuhinduzi:"translation",guhindura:"translate",amarangamutima:"sentiment",isesengura:"analysis",ikiganiro:"chatbot",gukoresha:"use",ibisubizo:"answers",ibibazo:"questions",ikibazo:"question",kinyarwanda:"kinyarwanda",amazina:"named entity",umubare:"number",icyitegererezo:"model",imyitozo:"training",ikizamini:"test",ukuri:"accuracy",ijwi:"speech",kumenya:"recognition",gutandukanya:"classification",inkuru:"text",gusukura:"cleaning",ibisobanuro:"meaning",imbonerahamwe:"table"};
const SW=new Set("a an the is are was of to in on for and or it this that be by with as at from can do does how what why who i you me my your please tell about explain define describe meaning mean ni iki ikihe ese mu na ku cya bya wa ya za ba kuri ngo cyangwa kandi hari se".split(" "));
const stem=w=>w.replace(/(ing|ers|er|ed|es|s|ation|ization)$/,"").replace(/^(.{3,})i$/,"$1");
function toks(t,rw){let w=t.toLowerCase().replace(/tf[\s-]*idf/g,"tfidf").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
 if(rw)w=w.flatMap(x=>(GL[x]||x).split(" "));
 w=w.filter(x=>!SW.has(x)).map(stem).filter(x=>x.length>1);
 return w.concat(w.slice(1).map((x,i)=>w[i]+"_"+x))}
// Build TF-IDF over question + answer text (question weighted x2)
const docs=KB.map(k=>toks(k.q+" "+k.q+" "+k.a)),df={};
docs.forEach(d=>new Set(d).forEach(t=>df[t]=(df[t]||0)+1));
const N=docs.length,idf=t=>Math.log((1+N)/(1+(df[t]||0)))+1;
function vec(d){const tf={};d.forEach(t=>tf[t]=(tf[t]||0)+1);let n=0;for(const t in tf){tf[t]*=idf(t);n+=tf[t]**2}n=Math.sqrt(n)||1;for(const t in tf)tf[t]/=n;return tf}
const V=docs.map(vec);
const QT=KB.map(k=>new Set(toks(k.q).filter(x=>!x.includes("_"))));
function ask(text,rw){const tk=toks(text,rw),u=new Set(tk.filter(x=>!x.includes("_"))),qv=vec(tk);
 return V.map((v,i)=>{let s=0;for(const t in qv)if(v[t])s+=qv[t]*v[t];let c=0;u.forEach(x=>{if(QT[i].has(x))c++});s+=0.4*(u.size?2*c/(u.size+QT[i].size):0);return{i,s:s*(KB[i].l===L?1.08:1)}}).sort((a,b)=>b.s-a.s)}
let L="en",rec=null;const $=id=>document.getElementById(id),chat=$("chat");
function add(cls,txt){const d=document.createElement("div");d.className="m "+cls;d.textContent=txt;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function chips(el,list){const c=document.createElement("div");c.className="chips";list.forEach(q=>{const b=document.createElement("button");b.className="chip";b.textContent=q;b.onclick=()=>send(q);c.appendChild(b)});el.appendChild(c)}
function typing(){const d=add("b","");d.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';return d}
function type(d,txt,done){d.textContent="";let i=0;const st=Math.max(1,Math.ceil(txt.length/80));const iv=setInterval(()=>{i+=st;d.textContent=txt.slice(0,i);chat.scrollTop=chat.scrollHeight;if(i>=txt.length){clearInterval(iv);done&&done()}},20)}
function reply(txt,idx){const d=typing();setTimeout(()=>type(d,txt,()=>{if(idx==null)return;const T=UI[L],p=(idx+H)%(2*H),m=document.createElement("div");m.className="meta";
 const b1=document.createElement("button");b1.className="mini";b1.textContent="🌍 "+(KB[p].l==="rw"?"Kinyarwanda":"English");b1.onclick=()=>reply(KB[p].a,p);
 const b2=document.createElement("button");b2.className="mini";b2.textContent="🔊 "+T.say;b2.onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(KB[idx].a);u.lang=KB[idx].l==="rw"?"rw-RW":"en-US";speechSynthesis.speak(u)};
 const g=document.createElement("span");g.className="tag";g.textContent=T.more;m.append(b1,b2,g);d.appendChild(m);chat.scrollTop=chat.scrollHeight}),550)}
function send(text){text=(text||$("q").value).trim();if(!text)return;$("q").value="";add("u",text);
 const r=ask(text,false),top=r[0],T=UI[L],lw=text.toLowerCase(),n=text.split(/\s+/).length;
 if(/^(hi|hello|hey|good (morning|afternoon|evening)|muraho|mwiriwe|bite|amakuru|mwaramutse)\b/.test(lw)&&n<5)return reply(T.hey);
 if(/\b(thanks?|thank you|murakoze|urakoze|ndagushimira)\b/.test(lw)&&n<6)return reply(T.thx);
 if(top.s<0.10)return reply(T.none);
 if(top.s<0.18)return reply(T.near);
 reply(KB[top.i].a,top.i)}
function setL(l){L=l;const T=UI[l];$("sub").textContent=T.sub;$("q").placeholder=T.ph;$("send").textContent=T.send;$("clr").textContent=T.clr;$("foot").textContent=T.foot}
function start(){chat.innerHTML="";add("b",UI[L].hi)}
$("lang").onchange=e=>{setL(e.target.value);start()};$("clr").onclick=start;$("send").onclick=()=>send();
$("q").onkeydown=e=>{if(e.key==="Enter")send()};
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert(UI[L].nov);
 if(rec){rec.stop();return}rec=new SR();rec.lang=L==="rw"?"rw-RW":"en-US";
 rec.onstart=()=>$("mic").classList.add("rec");rec.onend=()=>{$("mic").classList.remove("rec");rec=null};
 rec.onerror=()=>{rec=null};rec.onresult=e=>{$("q").value=e.results[0][0].transcript;send()};rec.start()};
setL("en");start();
